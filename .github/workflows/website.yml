name: Website build

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/download-release.py'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/download-release.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check both locales
        run: pnpm check
      - name: Build both locales and install shell route
        run: pnpm build
      - name: Validate versioned release links and installer helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path("src/data/site.ts").read_text()
          for old in ("releases/latest/download/Tigris.apk", "releases/latest/download/Tigris-guard.apk"):
              assert old not in data, old
          assert "download-release.py" in data
          import re
          tag = re.search(r'releaseTag: "(v[0-9]+\.[0-9]+\.[0-9]+)"', data).group(1)
          for flavor in ("Tigris", "Tigris-guard"):
              asset = f"https://github.com/lesnolie/Tigris/releases/download/{tag}/{flavor}-{tag}.apk"
              assert asset in data, f"Missing direct APK link: {asset}"
              for page in ("dist/index.html", "dist/en/index.html"):
                  assert asset in Path(page).read_text(), f"Broken download link in {page}"
          assert Path("dist/install.sh").exists()
          print("Website direct APK downloads and locale routes OK")
          PY
